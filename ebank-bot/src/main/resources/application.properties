spring.application.name=ebank-bot

server.port=8083

spring.config.import=optional:file:.env[.properties],optional:file:ebank-bot/.env[.properties]
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=openai/gpt-oss-120b

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8081/mcp
spring.ai.mcp.client.streamable-http.connections.transactions.url=http://localhost:8082/mcp


telegram.token=${TELEGRAM_TOKEN}

eureka.client.jersey.enabled=false
