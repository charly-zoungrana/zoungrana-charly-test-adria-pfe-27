spring.application.name=transaction-service

server.port=8082

spring.datasource.url=jdbc:h2:mem:transaction-db

spring.h2.console.enabled=true
spring.cloud.discovery.enabled=false
spring.cloud.config.enabled=false

spring.ai.mcp.server.protocol=streamable


bank.transaction.max-amount=1000

# Start account-service before transaction-service. Override this URL in Docker.
bank.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.account-service.connectTimeout=1000
spring.cloud.openfeign.client.config.account-service.readTimeout=2000
bank.account-service.failure-threshold=50
bank.account-service.open-duration-seconds=10
bank.demo-data.enabled=true
server.error.include-message=always
